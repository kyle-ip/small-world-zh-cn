  <p>在回合结束时，你占据的每个山脉地区可以放置 1 个熔岩代币在与该山脉地区相邻的任何地区（不包括受特殊和种族能力保护的地区）。</p>
  
  <div id="info" class="image"></div>

  <p>该地区中的所有代币被战败玩家收回手中，视为该地区被征服（除了没有代币损失）。</p>

  <p>在下一回合开始之前，任何其他玩家都不能进入该地区。在下一回合开始时，从棋盘上移除所有熔岩代币并照常进行。</p>
