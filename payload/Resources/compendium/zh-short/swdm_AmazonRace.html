  <p>额外的 4 个亚马逊代币只能用于征服，不能用于防御。因此你的初始回合以 6 + 4 = 10 个亚马逊代币开始（加上你可能从与亚马逊关联的特殊能力获得的额外代币，取决于你的组合）。</p>

  <img class="info" src="../image/hdpi/info-Amazon.png" width="215"/>

  <p>在每次部队重新部署结束时，你必须从地图上移除 4 个亚马逊代币，通过拖放将它们放回你的代币区域。如果可能，请确保每个地区至少留下 1 个亚马逊代币。这 4 个代币在下一回合开始时再次可用，但仅用于攻击。</p>
