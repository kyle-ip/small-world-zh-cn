  <p>进入衰落时，你的食尸鬼代币全部留在地图上，而不是通常的每个地区 1 个代币。</p>

  <p>此外，与其他种族不同，一旦进入衰落，你的食尸鬼可以在接下来的回合中继续征服新地区，就像它们仍然是活跃代币一样。</p>

  <p>这些征服必须在回合开始时进行，在你的活跃种族进行任何征服之前。如果你愿意，你可以用衰落中的食尸鬼攻击你自己当前活跃的种族。</p>
