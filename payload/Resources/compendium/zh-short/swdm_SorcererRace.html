  <p>每回合对每个对手一次，你的巫师可以用你自己的一个代币替换对手的一个活跃代币来征服地区。要这样做，只需将手牌中的魔杖图标拖放到你想用新巫师替换的代币上。</p>

  <img class="info" src="../image/hdpi/info-Sorcerer.png" width="215"/>

  <p>你的巫师替换的代币必须是该地区唯一的种族代币，且该地区必须是你的巫师能够征服的。带巨魔巢穴的单个巨魔代币被视为单独的；堡垒中或山脉上的种族代币也是如此；这些标记不保护单独的种族代币。 </p>
