  <p>当与你的灵魂特殊能力关联的种族代币进入衰落时，它们不计入地图上任何时候只能有一个衰落种族的限制。</p>

  <p>因此，你可能最终在地图上同时有两个不同的衰落种族并为它们计分。如果你控制的第三个种族进入衰落，你的灵魂留在棋盘上，但另一个已衰落的种族照常消失。</p>

  <p>换句话说，你衰落中的灵魂永远不会离开地图（除非因对手征服而损失），但其他进入衰落的种族可能会在新种族进入衰落时消失。</p>
