  <p>冰雪女巫在重新部署阶段结束时，每控制一个魔法源收集 1 个冬季标记。</p>

  <p class="info" style="width:100px;font-size: medium;"><img src="../image/hdpi/info-Winter.png" width="75" style="vertical-align:sub;"/><b>x6</b></p>

  <p>在重新部署阶段结束时，冰雪女巫可以将她们的冬季标记放置在自己的地区或任何相邻地区（但每个地区不能超过 1 个冬季标记）。</p>
  <p>冬季标记永久使该地区的防御 +1。</p>
  <p>只要冰雪女巫活跃，它就留在棋盘上。有冬季标记但不被冰雪女巫控制的地区比平常少获得 1 枚胜利金币。</p>
