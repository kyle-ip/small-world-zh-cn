  <p>当你的灵魂触摸种族进入衰落时，它自动复活你衰落中的种族。你不需要在下一回合选择新种族，而是激活你之前衰落的种族。</p>

  <p>你可以保留衰落种族已在棋盘上的代币，将它们翻回活跃面；或者如果你愿意，将它们收回手牌。你获得如果这是一个新组合选择时会收到的其余种族代币（和标记，如果有的话），并立即用它们进行完整的一回合。</p>
