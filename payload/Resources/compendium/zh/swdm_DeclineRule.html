  <h1>进入衰落</h1>

  <p>经过几回合的征服后，你的 <a href="swdm_RacesRule.html">种族</a> 通常会发现自己过度扩张，几乎无法防御他人，或征服更多 <a href="swdm_RegionsRule.html">地区</a>。发生这种情况时，你可能想考虑在回合开始时按此图标进入衰落。</p>
  <img src="../image/hdpi/11-goingindecline1.jpg" width="215" heigth="224"/>

  <p>这样做会自动将你的 <a href="swdm_CombosRule.html">种族与特殊能力组合</a> 翻面，并丢弃你所有的种族代币，除了每个地区留 1 个，翻到衰落面。 </p>
  <img src="../image/hdpi/11-goingindecline2.jpg" width="269" heigth="122"/>

  <p>发生这种情况时，你通常会失去组合的优势，但你现在不活跃的种族代币留在地图上并继续计分；你将能在下一回合开始时选择新组合。</p>

  <p>你在任何时候只能有一个衰落种族。如果你的另一个种族进入衰落，前一个立即从地图上消失。</p>
