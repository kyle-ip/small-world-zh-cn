  <h1>绿色地区</h1>

  <p>当你拖动一个 <a href="swdm_RaceTokensRule.html">种族代币</a> 在一个 <a href="swdm_RegionsRule.html">地区</a>，如果地区以绿色高亮，你可以征服它。</p>

  <img src="../image/hdpi/6-greenregions.jpg" width="249" heigth="158"/>

  <p>征服一个地区的通常成本是 2 个种族代币 + 每个额外 1 个代币 <a href="swdm_MarkersRule.html">标记</a> （失落部落、其他玩家的种族代币、山脉等）在该地区中。</p>

  <p>在你回合的最后一次征服中，如果你缺少代币来征服一个地区，一个 <a href="swdm_DieRule.html">征服骰</a> 可能出现在你的种族代币角落，指示你需要掷出多少点数才能成功征服该地区。</p>
