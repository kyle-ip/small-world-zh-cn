  <h1 class="optional">火球</h1>

  <p>在回合结束时，你占据的每个魔法源获得 1 个火球标记。火球算作 2 个种族代币，但只能在你后续回合的攻击中使用。使用后即丢弃。 </p>
  
  <img class="info" src="../image/hdpi/info-Fireball.png" width="215"/>

  <p>可以使用多个火球征服一个地区。你仍需至少 1 个种族代币来占据该地区。</p>
