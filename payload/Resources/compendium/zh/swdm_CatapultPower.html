  <h1 class="optional">投石机</h1>

  <p>每回合一次，你可以将投石机放置在你占据的地区，以征服距离 1 个地区（但不相邻）的任何地区，所需代币比平常少 1 个。投石机可以攻击湖泊对岸的地区，但不能越过海洋。</p>

  <img class="info" src="../image/hdpi/info-Catapult.png" width="215"/>

  <p>有投石机的地区免疫敌人的征服以及他们的种族和特殊能力。</p>

  <p>投石机在你进入衰落时消失。</p>
