  <h1 class="optional">半身人</h1>

  <p>你的半身人士币可以通过地图上的任何地区进入地图，而不仅仅是边境地区。你征服的前 2 个地区各放置一个地洞，使其免疫敌人的征服以及种族和特殊能力。</p>

  <img class="info" src="../image/hdpi/info-Halfling.png" width="215"/>

  <p>当你的半身人进入衰落，或你选择放弃包含地洞的地区时，你的地洞被移除（你失去它们提供的保护）。</p>
