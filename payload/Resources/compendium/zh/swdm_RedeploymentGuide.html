  <h1>自动重新部署</h1>

  <p>在 3 到 5 人游戏中，如果一些玩家的地区被征服，他们可以将占据这些地区的部队（减去任何损失）重新部署到他们仍有部队的其他地区，如果可能的话。</p>

  <p>为了加快速度，重新部署默认为自动；但在你创建的游戏中，你可以覆盖此选择。</p>

  <img src="../image/hdpi/UG-11-autoredeploy.jpg" width="275" height="160"/>

  <p>请注意，这样做会在需要重新部署的玩家之间增加额外的往返回合，减慢你的游戏速度。我们建议仅在你和其他玩家认为你必须绝对控制每次部队重新部署的最微小细节的超竞争游戏中关闭自动重新部署。</p>
