  <h1>游戏设置</h1>

  <ul>
    <li>在传玩游戏中，你可以混合使用机器人和真实玩家。反复点击一个槽位以在 3 种可能的设置之间循环（机器人、人类玩家、无玩家）。</li>
    <img src="../image/hdpi/UG-7-mixbots.jpg" width="275" height="160"/>

    <li>在单人、面对面、传玩和本地游戏中，你可以通过点击人类玩家并输入新名称来更改他们的名字。</li>
    <img src="../image/hdpi/UG-8-namefield.jpg" width="275" height="160"/>

    <li>在单人、面对面和传玩模式中，你可以通过点击种族旗帜来选择先手玩家。使用 ? 图标随机设置先手玩家。</li>
    <img src="../image/hdpi/UG-9-firstplayer.jpg" width="275" height="160"/>
  </ul>
