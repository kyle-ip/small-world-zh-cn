  <h1>征服地区</h1>

  <p>要征服一个 <a href="swdm_RegionsRule.html">地区</a>，将 <a href="swdm_RaceTokensRule.html">种族代币</a> 从屏幕底部拖放到你想征服的地区上。</p>

  <p>如果地区的边界高亮为 <a href="swdm_RedRegionsRule.html">红色</a>，你不能征服它。
  <img src="../image/hdpi/4-conqueringregions-red.jpg" width="249" heigth="158"/>

  <p>如果地区的边界高亮为 <a href="swdm_GreenRegionsRule.html">绿色</a>，你可以征服它。</p>
  <img src="../image/hdpi/4-conqueringregions-green.jpg" width="249" heigth="158"/>

  <p>将你的种族代币放到地区上；游戏会自动堆叠征服该地区所需的代币数量。</p>

  <p>放下的代币将留在该地区，直到你的回合结束，届时你可以 <a href="swdm_RedeployingRule.html">重新部署</a> 其中一些到你占据的其他地区。</p>
