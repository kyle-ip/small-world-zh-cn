  <h1>游戏目标</h1>
  <p>你的目标是获得更多 <a href="swdm_CoinsRule.html">胜利金币</a> 比你的对手。</p>
  <p>你每次花费金币当你跳过一个 <a href="swdm_CombosRule.html">组合</a>，当 <a href="swdm_PickingRule.html">选择新种族</a>.</p>
  <p>你每次得分金币当你的 <a href="swdm_RaceTokensRule.html">种族代币</a> 占据一个 <a href="swdm_RegionsRule.html">地区</a> 在结束时 <a href="swdm_TurnRule.html">游戏回合</a>.</p>
  <p>游戏结束时，金币最多的玩家获胜。</p>
