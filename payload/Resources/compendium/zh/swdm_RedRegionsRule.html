  <h1>红色地区</h1>

  <p>当你拖动一个 <a href="swdm_RaceTokensRule.html">种族代币</a> 在一个 <a href="swdm_RegionsRule.html">地区</a>，如果地区以红色高亮，你不能征服它。</p>

  <img src="../image/hdpi/9-redregions.jpg" width="249" heigth="158"/>

  <p>要么因为你不被允许：</p>
  <ul>
    <li>首次进入棋盘时，通常只有边境地区可进入</li>
    <li>龙和其他一些角色使地区免疫攻击；等。</li>
  </ul>

  <p>要么因为：</p>
  <ul>
    <li>你没有 <a href="swdm_GreenRegionsRule.html">足够的种族代币</a> 来征服该地区。</li>
  </ul>
