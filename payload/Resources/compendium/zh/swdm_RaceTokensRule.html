  <h1>种族代币</h1>

  <p>同一种族的代币堆叠在一起以征服 <a href="swdm_RegionsRule.html"> 地区 </a> 的小小世界。</p>

  <p>玩家获得的种族代币数量根据该种族与特殊能力组合中橙色圆圈内 2 个白色数字之和而变化。</p>
  <img src="../image/hdpi/3-racetokens.jpg" width="313" heigth="143"/>

  <p>彩色面朝上的种族代币为活跃状态；灰色面朝上的为衰落状态。</p>
