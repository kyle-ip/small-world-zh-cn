  <h1>单场游戏与多场游戏</h1>

  <p>你可以玩 2 种不同类型的在线游戏：单场游戏和多场游戏。</p>

  <p>一个 <b>单场游戏</b> 游戏意在单一实时会话中进行，任何人都不能在任何时候离开游戏（即使只是查看电子邮件！）。<br/>
  如果你中途主动退出单场游戏，你将自动失败。机器人将取代你的位置，以便其他人仍能完成游戏。<br/>
  根据定义，你一次只能玩一场单场游戏。</p>

  <img src="../image/hdpi/UG-22-singlesessionicon.jpg" width="119" height="133"/>

  <p>一个 <b>多场游戏</b> 游戏是异步进行的：它可以被"暂停"，通常在较长时间内进行。
  你可以同时玩多场多场游戏，在一场游戏中玩一回合，切换到另一场游戏玩 1 回合，然后出去查看电子邮件等。除非你的 <a href="swdm_ClockGuide.html">玩家时钟</a> 用完！

  <img src="../image/hdpi/UG-23-multisessionicon.jpg" width="119" height="133"/>
