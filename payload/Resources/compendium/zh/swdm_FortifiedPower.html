  <h1 class="optional">筑城</h1>

  <p>每回合一次，只要你的筑城种族活跃，你可以在你占据的地区放置 1 个堡垒。堡垒在回合结束时价值 1 枚额外胜利金币，除非你处于衰落中。堡垒还使你地区的防御 +1，即使你处于衰落中。</p>

  <img class="info" src="../image/hdpi/info-Fortified.png" width="215"/>

  <p>如果你放弃该地区或敌人征服它，堡垒回到你的手牌。每个地区最多只能有 1 个堡垒，地图上最多有 6 个堡垒。</p>
