  <h1 class="optional">雇佣兵</h1>

  <p>每次你征服一个地区时，你可以花费 1 枚胜利金币将征服该地区所需的代币数量减少 2 个。要这样做，只需将手牌中的剑图标拖放到你想征服的地区上。</p>

  <img class="info" src="../image/hdpi/info-Mercenary.png" width="215"/>

  <p>如果你在最后的征服尝试中使用雇佣兵，你可以在掷强化骰后决定这样做。仍需至少 1 个代币来占据该地区。 </p>
  <p>每次征服你不能花费超过 1 枚胜利金币来增加雇佣兵加成。</p>
