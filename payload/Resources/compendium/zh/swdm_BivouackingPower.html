  <h1 class="optional">露营</h1>

  <p>在部队重新部署阶段，将 5 个营地代币部署到你的任何地区。每个营地在其所在地区的防御中算作 1 个种族代币（从而保护带有营地的单个种族代币免受巫师种族能力的影响）。</p>
  
  <p>可以在同一地区放置多个营地以获得更高的防御加成。</p>

  <img class="info" src="../image/hdpi/info-Bivouacking.png" width="215"/>

  <p> 每回合你可以拔营并在你占据的任何新地区定居。营地在其所在地区遭受攻击时永远不会丢失：它们在当前玩家回合结束时重新部署。当它们关联的种族进入衰落时，它们消失。</p>
