  <h1>设置</h1>

  <p>你可以通过点击屏幕顶部的旗帜来更改你偏好的颜色。</p>

  <p>你可以从此屏幕使用你的 Days of Wonder（"DoW"）账号登录。登录设置按钮允许你执行更复杂的操作，例如将你的 DoW 账号关联到 Game Center 账号，切换到另一个 DoW 账号，甚至直接在网上管理你的 DoW 账号资料！如果你想选择一个更好听的登录名、更改密码或选择头像，请查看它。</p>
