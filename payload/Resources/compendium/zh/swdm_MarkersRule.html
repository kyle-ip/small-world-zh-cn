  <h1>标记</h1>

  <p>小小世界包含众多游戏标记。</p>

  <p>它们每个都使征服该地区的成本增加 1 个种族代币：</p>
  <img src="../image/hdpi/7-markers1.jpg" width="349" heigth="138"/>

  <ul>
    <li>游戏开始时占据地图的失落部落</li>
    <li>山脉</li>
    <li>巨魔种族的巢穴</li>
    <li>露营特殊能力的营地</li>
    <li>筑城特殊能力的堡垒</li>
  </ul>

  <p>或使该地区对对手的征服和种族与特殊能力免疫：</p>
  <img src="../image/hdpi/7-markers2.jpg" width="337" heigth="138"/>

  <ul>
    <li>龙</li>
    <li>英雄</li>
    <li>半身人种族的地洞</li>
  </ul>
