  <h1 class="optional">巨魔</h1>

  <p>在你的巨魔占据的每个地区放置一个巨魔巢穴。</p>

  <img class="info" src="../image/hdpi/info-Troll.png" width="215"/>

  <p>巨魔巢穴使你地区的防御 +1，即使巨魔进入衰落后仍留在该地区。如果你放弃该地区或敌人征服它，巨魔巢穴消失。</p>
