  <h1>胜利金币</h1>

  <p>货币是：</p>
  <ul>
    <li>用于跟踪玩家的 <a href="swdm_ScoringRule.html">分数</a></li>
    <li>支付 <a href="swdm_CombosRule.html">组合</a> 你想跳过的</li>
    <li>并从 <a href="swdm_RegionsRule.html">地区</a> 你在结束时占据的 <a href="swdm_TurnRule.html">回合</a>.</li>
  </ul>

  <p>每位玩家以 5 枚金币开始游戏。 </p>

  <p>要在游戏中的任何时候查看你的金币总数，点击头像正下方的金币。如有需要，用另一只手遮住结果。</p>
