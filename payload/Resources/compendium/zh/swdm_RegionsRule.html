  <h1>地区</h1>

  <p>小小世界地图上以白色边界划定的区域。</p>
  <img src="../image/hdpi/5-regionsd.jpg" width="349" heigth="163"/>

  <p>将种族代币移到其上时，地区的边界变为 <a href="swdm_GreenRegionsRule.html">绿色</a> 如果该地区可以被征服；以及 <a href="swdm_RedRegionsRule.html">红色</a> 否则。</p>

  <p>虽然很少推荐，但你可以在回合开始时放弃一个地区，将你的种族代币拖出并放回代币储备区。</p>

  <p>有关特定地区类型的更多详细信息，请查看小小世界规则书中的条目。</p>
