  <h1 class="optional">小矮妖</h1>

  <p>在重新部署期间，你可以在小矮妖占据的每个地区拖动 1 罐金币（但每个地区不超过 1 罐）。在下一回合开始时仍存在的每罐金币进入你的胜利储备，价值 1 枚金币。</p>

  <img class="info" src="../image/hdpi/info-Leprechaun.png" width="215"/>

  <p>如果对手在下一回合前征服其中一个地区，他将获得金币罐。任何剩余的金币罐可以在后续重新部署中重复使用，直到全部用完。</p>
