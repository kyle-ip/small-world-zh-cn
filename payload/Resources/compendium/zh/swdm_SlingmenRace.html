  <h1 class="optional">投石兵（Bill Gurski 设计）</h1>

  <p>投石兵可以征服距离其当前占据地区 1 个地区的地区，前提是他们不控制与该地区相邻的地区。</p>
  <p>当以此方式征服地区时，他们立即从储备中取走 1 枚胜利金币。他们可以征服湖泊对岸的地区，但不能越过海洋。</p>
