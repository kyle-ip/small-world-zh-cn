  <h1 class="optional">外交官</h1>

  <p>在回合结束时，点击完成之前，你可以选择一个本回合你没有攻击其活跃种族的对手并选择与她和解。要这样做，将手牌中的鸽子图标拖放到该玩家的头像上。</p>

  <img class="info" src="../image/hdpi/info-Diplomat.png" width="215"/>

  <p>该玩家现在与你和解，在她的回合中不能攻击你的活跃种族。你可以每回合与不同的对手和解，或与同一对手保持和解。</p>

  <p>衰落中的代币不受影响（因此衰落中的食尸鬼对此能力免疫，仍可攻击你）。</p>
