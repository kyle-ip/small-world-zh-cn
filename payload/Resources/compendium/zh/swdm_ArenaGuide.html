  <h1>在线竞技场</h1>

  <p>在线竞技场是你创建或加入与其他玩家对战的在线游戏的区域。</p>

  <img src="../image/hdpi/UG-27-onlinearena-en.jpg" width="225" height="165"/>

  <p>连接你的 Days of Wonder 账号后，你会看到一个分为 3 部分的屏幕。从左到右：</p>
  <ul>
    <li>这 <b>玩家列表</b> 当前连接并等待游戏。点击一个名字可显示该玩家的详细信息： <a href="swdm_RankingGuide.html">排名分数</a>, <a href="swdm_RankingGuide.html">因果</a>等。</li>
    <li>一个 <b>聊天区域</b>，输入消息并与他人讨论。尽管小小世界有时可能很残酷，请保持温和的语气，把公平竞争作为你的首要目标；我们希望每个人都能玩得开心！</li>
    <li>这 <b>加入/创建面板</b>，列出你可以加入或创建的游戏。</li>
  </ul>
