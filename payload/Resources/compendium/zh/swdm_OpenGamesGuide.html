  <h1>开放游戏列表</h1>

  <p>默认情况下，你会看到开放游戏列表。每场游戏包含多个图标，提供有关该游戏的详细信息。</p>

  <img src="../image/hdpi/UG-14-gameinfo.jpg" width="400" height="130"/>

  <table id="details">
    <tr>
      <td width="100"><img src="../image/hdpi/UG-15-gamemode.jpg" width="86" height="50"/></td>
      <td>游戏类型： <a href="swdm_SessionsGuide.html">单场游戏</a> 或 <a href="swdm_SessionsGuide.html">多场游戏</a> 游戏，带有 <a href="swdm_ClockGuide.html">玩家时钟</a> （分配给每位玩家完成整场游戏的时间）。</td>
    </tr>
    <tr>
      <td><img src="../image/hdpi/UG-16-gamenumberofplayer.jpg" width="86" height="50"/></td>
      <td>开始此游戏所需的玩家数量。</td>
    </tr>
    <tr>
      <td><img src="../image/hdpi/UG-17-gameexpansions.jpg" width="86" height="50"/></td>
      <td>本场游戏使用的扩展。</td>
    </tr>
    <tr>
      <td><img src="../image/hdpi/UG-18-gameranked.jpg" width="86" height="50"/></td>
      <td>游戏是否 <a href="swdm_RankingGuide.html">计入排名</a>.</td>
    </tr>
    <tr>
      <td><img src="../image/hdpi/UG-19-gamekarma.jpg" width="86" height="50"/></td>
      <td>最低 <a href="swdm_RankingGuide.html">因果</a> 需要加入此游戏。</td>
    </tr>
    <tr>
      <td><img src="../image/hdpi/UG-20-gameredeploy.jpg" width="86" height="50"/></td>
      <td>是否 <a href="swdm_RedeploymentGuide.html">自动重新部署</a> 是否激活。</td>
    </tr>
    <tr>
      <td><img src="../image/hdpi/UG-21-gameprivat.jpg" width="86" height="50"/></td>
      <td>游戏是私人还是公开。私人游戏需要密码。</td>
    </tr>
  </table>
  <p>选择一个游戏查看已加入的玩家。点击加入进入此游戏。</p>
