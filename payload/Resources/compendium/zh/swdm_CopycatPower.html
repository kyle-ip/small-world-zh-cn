  <h1 class="optional">模仿者（Andrew Capel 设计）</h1>

  <p>在每回合开始时，你可以将模仿者标记放置在棋盘旁边组合列表中的六个能力之一上。</p>
  
  <img class="info" src="../image/hdpi/info-Copycat.png" width="60"/>

  <p>你的活跃种族从此能力的效果中受益，直到下一回合开始，或直到对手选择它作为其组合。当能力效果停止时，你失去所有这些特殊能力代币。</p>

  <p>请注意，某些特殊能力仅在特定回合生效（例如"富豪"仅在你的第一回合生效，"坚韧"仅在你进入衰落时生效等）。</p>
