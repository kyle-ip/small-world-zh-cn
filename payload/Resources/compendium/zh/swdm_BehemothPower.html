  <h1 class="optional">巨兽</h1>

  <p>你的 2 个巨兽在攻击和防御时都表现为与你占据的沼泽地区数量相匹配的代币堆。每次你占领或失去一个沼泽地区时，每个巨兽中的代币数量都会调整。</p>
  
  <img class="info" src="../image/hdpi/info-Behemoth.png" width="215"/>

  <p>巨兽必须始终伴随至少 1 个种族代币。如果它占据的地区被征服，只有伴随的种族代币损失；像平常一样在攻击者回合结束时重新部署你的巨兽。</p>
