  <h1>排名与因果</h1>

  <p><b>排名游戏</b> 是创建游戏时排名选项已开启的游戏。我们的排名基于国际象棋比赛中使用的相同经典 ELO 系统。<br/>
  如果你未在分配的 <a href="swdm_ClockGuide.html">玩家时钟</a> 时间限制内玩你的回合，或者如果你在游戏结束前放弃游戏，你将自动输掉游戏，你的排名将受到影响。</p>

  <p><b>因果</b> 是一个旨在鼓励与他人游戏时正确（并阻止不当）行为的系统。<br/>
  因果值由 1 到 5 个点（从差到好）表示，位于玩家旗帜右侧。因果点下方的数字是该玩家的排名分数。<br/>
  作为新玩家，你以 50 点因果值（2.5 个点）开始。当你完成一场在线游戏时，你获得 1 点额外因果值（最多 100 点）。当你在游戏正常完成前中途放弃游戏时，你失去 5 点。</p>
