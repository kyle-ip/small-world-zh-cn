  <h1>创建新游戏</h1>

  <p>你也可以创建自己的游戏，使用你选择的设置，并等待其他人加入。</p>

  <img src="../image/hdpi/UG-26-createpanel-en.jpg" width="170" height="235"/>

  <p>游戏参数与 <a href="swdm_OpenGamesGuide.html">开放游戏列表</a> 页面。请注意，你可以通过点击第三个按钮来设置玩家时钟的自定义值，而不是使用建议的预设值。</p>
  <p>为你的游戏起一个简短易记的名字。</p>
  <p>如果你创建私人游戏，给它设置密码并确保告知他人，否则他们将无法加入！</p>
