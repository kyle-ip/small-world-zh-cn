  <h1>游戏回合</h1>

  <p>在游戏的第一回合，每位玩家：</p>

  <ul>
    <li><a href="swdm_RacesRule.html">选择新种族</a></li>
    <li><a href="swdm_ConqueringRegionRule.html">征服</a> 一些 <a href="swdm_RegionsRule.html">地区</a></li>
    <li><a href="swdm_ScoringRule.html">分数</a> 一些金币</li>
  </ul>

  <p>在后续回合中，每位玩家要么：</p>

    <li><a href="swdm_ScoringRule.html">分数</a> 一些金币</li>
  </ul>
