  <h1>计分</h1>

  <p>在每个回合结束时，你获得 1 <a href="swdm_CoinsRule.html">胜利金币</a> 每个 <a href="swdm_RegionsRule.html">地区</a> 你的地图 <a href="swdm_RaceTokensRule.html">种族代币</a> 占据，即使你的代币 <a href="swdm_DeclineRule.html">衰落中</a>.</p>

  <p>你也可能因你的 <a href="swdm_CombosRule.html">种族与特殊能力组合</a> 而获得额外金币。</p>

  <p>玩家分数保密并对其他玩家隐藏，直到游戏结束时金币最多的玩家被宣布为获胜者。</p>
