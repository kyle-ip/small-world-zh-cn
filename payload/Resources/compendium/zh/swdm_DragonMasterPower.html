  <h1 class="optional">驯龙师</h1>

  <p>每回合一次，你可以使用单个种族代币征服一个地区，无论防守该地区的敌人士币有多少。要这样做，只需将手牌中的龙拖放到你想征服的地区上。 </p>

  <img class="info" src="../image/hdpi/info-DragonMaster.png" width="215"/>

  <p>被征服的地区现在免疫敌人的征服以及他们的种族和特殊能力，直到你的龙移动。</p>

  <p> 在每个新回合中，你可以将龙移动到你想征服的另一个地区。龙在你进入衰落时消失。</p>
