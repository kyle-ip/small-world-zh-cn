  <h1>玩家时钟</h1>

  <p>所有在线游戏（ <a href="swdm_SessionsGuide.html">单场游戏</a> 和 <a href="swdm_SessionsGuide.html">多场游戏</a>）依赖于 <b>玩家时钟</b> 为每位玩家。这些玩家时钟控制每位玩家有多少时间来玩 <i>整场游戏</i>.</p>

  <p>每位玩家的玩家时钟在轮到该玩家游戏时自动开始倒计时，并在该玩家完成回合时立即暂停，就像国际象棋比赛中的玩家时钟一样。</p>

  <img src="../image/hdpi/UG-24-ingameclockimage.jpg" width="158" height="109"/>

  <p>如果玩家时间用完，他/她自动输掉该游戏；机器人取代他/她，以便其他时钟上还有时间的玩家仍能完成游戏（如果他们愿意）。</p>
