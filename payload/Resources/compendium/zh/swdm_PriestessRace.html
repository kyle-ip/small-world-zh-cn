  <h1 class="optional">女祭司</h1>

  <p>进入衰落时，你所有衰落中的女祭司堆叠在一起，在她们占据的一个地区形成一个单一的"象牙塔"堆，放弃所有其他地区。每回合，象牙塔中的每个女祭司为你获得 1 枚额外胜利金币，代替你通常的衰落计分。</p>

  <p class="optional">注意：你的象牙塔仍可能像其他任何地区一样被征服（用足够的种族代币或龙！）如果你的女祭司有筑城能力，她们的象牙塔可以建在单个堡垒之上。</p>
