  <h1>重新部署代币</h1>

  <p>你可以重新安排你的 <a href="swdm_RaceTokensRule.html">种族代币</a> 在你的回合结束时，按重新部署。</p>
  <img src="../image/hdpi/10-redeployingtokens1.jpg" width="213" heigth="229"/>

  <p>这让你有机会重新组织代币，加强一些的防御 <a href="swdm_RegionsRule.html">地区</a> 以牺牲其他地区为代价；但你必须始终在你征服的每个地区保留至少 1 个种族代币。</p>
  <img src="../image/hdpi/10-redeployingtokens2.jpg" width="237" heigth="139"/>

  <p>如果另一个玩家在你征服的地区中，他自动失去 1 个种族代币。该地区中的任何其他代币自动回到他的储备区，从那里可以在你回合结束时重新部署。</p>

  <p>如果你在回合中将某个玩家的种族从地图上完全消灭，该种族要到该玩家下一回合开始才能重新进入地图。</p>
